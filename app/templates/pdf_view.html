<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#111;}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#pageCanvas{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);max-width:100%;max-height:100%;}
#nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  align-items:center;background:rgba(0,0,0,.62);border-radius:999px;padding:7px 14px;z-index:50;
  transition:opacity .4s;}
#nav.dim{opacity:.12;}
#nav button{border:0;background:#fff;color:#111;border-radius:999px;width:32px;height:32px;
  font-size:15px;cursor:pointer;font-weight:700;}
#nav button:disabled{opacity:.35;cursor:default;}
#nav .pg{color:#fff;font-size:12px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;}
#nav a{color:#fff;font-size:11px;text-decoration:none;border:1px solid rgba(255,255,255,.5);
  border-radius:999px;padding:4px 10px;}
#hint{position:fixed;top:12px;right:14px;color:rgba(255,255,255,.55);font-size:11px;z-index:50;}
#title{position:fixed;top:12px;left:14px;color:rgba(255,255,255,.75);font-size:12px;z-index:50;
  max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#loading,#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;}
#err{display:none;flex-direction:column;gap:10px;text-align:center;}
#err a{color:#7bb1ff;}
</style>
</head>
<body>
<div id="title">{{ name }}</div>
<div id="hint">← → 페이지 이동 · F 전체화면 · Esc 닫기</div>
<div id="loading">불러오는 중…</div>
<div id="err">
  <div>PDF를 표시할 수 없습니다.</div>
  <a href="{{ src }}" target="_blank" rel="noopener">원본 파일 새 탭에서 열기</a>
</div>
<div id="stage"><canvas id="pageCanvas"></canvas></div>
<div id="nav">
  <button id="prev" title="이전 (←)">‹</button>
  <span class="pg" id="pg">- / -</span>
  <button id="next" title="다음 (→)">›</button>
  <a href="{{ src }}" target="_blank" rel="noopener">⤓ 원본</a>
</div>

<script type="module">
import * as pdfjsLib from "/static/pdfjs/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "/static/pdfjs/pdf.worker.min.mjs";

const src = {{ src|tojson }};
const canvas = document.getElementById("pageCanvas");
const ctx = canvas.getContext("2d");
const pgEl = document.getElementById("pg");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const loadingEl = document.getElementById("loading");
const errEl = document.getElementById("err");
const navEl = document.getElementById("nav");

let pdf = null, cur = 1, rendering = false, pending = null;

async function renderPage(n) {
  if (rendering) { pending = n; return; }
  rendering = true;
  const page = await pdf.getPage(n);
  const vp0 = page.getViewport({ scale: 1 });
  // 화면(뷰포트)에 페이지 한 장이 꽉 차게 — 가로/세로 중 더 빡빡한 비율로 맞춘다.
  const availW = window.innerWidth * 0.94, availH = window.innerHeight * 0.88;
  const scale = Math.min(availW / vp0.width, availH / vp0.height);
  const vp = page.getViewport({ scale });
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = vp.width + "px";
  canvas.style.height = vp.height + "px";
  await page.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  cur = n;
  pgEl.textContent = cur + " / " + pdf.numPages;
  prevBtn.disabled = cur <= 1;
  // 마지막 장에서도 '다음' 버튼은 눌러야 하므로(누르면 닫힘) 여기선 비활성화하지 않는다.
  const isLast = cur >= pdf.numPages;
  nextBtn.title = isLast ? "닫기" : "다음 (→)";
  nextBtn.textContent = isLast ? "✕" : "›";
  rendering = false;
  if (pending !== null) { const p = pending; pending = null; renderPage(p); }
}

function go(delta) {
  if (!pdf) return;
  const n = cur + delta;
  // 마지막 장에서 '다음'을 누르면 뷰어를 닫는다(2026-07-31 확정) — 새 탭으로 열렸을 때만
  // window.close()가 먹으므로, 같은 탭에서 열린 경우엔 대신 원본 목록으로 돌려보낸다.
  if (n > pdf.numPages) {
    window.close();
    setTimeout(() => { if (!window.closed) history.back(); }, 150);
    return;
  }
  if (n < 1) return;
  renderPage(n);
}

prevBtn.addEventListener("click", () => go(-1));
nextBtn.addEventListener("click", () => go(1));
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "Escape") window.close();
  else if (e.key === "f" || e.key === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});
window.addEventListener("resize", () => { if (pdf) renderPage(cur); });

// 조작 바 자동 숨김(마우스 안 움직이면 흐려짐) — 보고서 뷰어와 동일한 패턴.
let dimTimer;
function wake() {
  navEl.classList.remove("dim");
  clearTimeout(dimTimer);
  dimTimer = setTimeout(() => navEl.classList.add("dim"), 2500);
}
window.addEventListener("mousemove", wake);
wake();

pdfjsLib.getDocument({ url: src }).promise.then((doc) => {
  pdf = doc;
  loadingEl.style.display = "none";
  renderPage(1);
}).catch((e) => {
  loadingEl.style.display = "none";
  errEl.style.display = "flex";
  console.error(e);
});
</script>
</body>
</html>
