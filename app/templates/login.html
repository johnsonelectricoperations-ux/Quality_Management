<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 통합품질관리시스템</title>
<link rel="stylesheet" href="/static/qms.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <h2>통합품질관리시스템</h2>
    <div class="sub">Johnson Electric Operations · Quality Management</div>
    {% if err %}<div class="note" style="background:var(--err-bg);color:var(--err);margin-bottom:14px;">{{ err }}</div>{% endif %}
    <div class="f" style="margin-bottom:12px;"><label>아이디</label><input class="in" name="username" placeholder="아이디" autofocus></div>
    <div class="f" style="margin-bottom:18px;"><label>비밀번호</label><input class="in" type="password" name="password" placeholder="••••••••"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center;padding:12px;">로그인</button>
  </form>
</div>
<script src="/static/theme.js"></script>
</body>
</html>
