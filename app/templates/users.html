{% extends "base.html" %}
{% block content %}
<div class="panel"><div class="phead"><h2>사용자 목록</h2><span class="tot">{{ users|length }}명</span></div>
  <table><thead><tr><th>아이디</th><th>이름</th><th>권한</th></tr></thead><tbody>
  {% for r in users %}<tr><td class="mono">{{ r.username }}</td><td>{{ r.name }}</td>
    <td>{% if r.role=='admin' %}<span class="badge bg-err">관리자</span>{% elif r.role=='editor' %}<span class="badge bg-info">입력자</span>{% else %}<span class="badge bg-hold">조회자</span>{% endif %}</td></tr>{% endfor %}
  </tbody></table>
</div>
{% endblock %}
